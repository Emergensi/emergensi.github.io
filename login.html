<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="assets/site.webmanifest" />
  <title>Pilih Akses — Emergency Unit SGH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-label="Pilih akses Emergency Unit SGH">
      <div class="login-brand">
        <span class="brand-mark logo-mark"><img src="assets/emergency-logo.png" alt="Logo Emergency Unit"></span>
        <div>
          <h1>Emergency Unit</h1>
          <p>Sedayu General Hospital</p>
        </div>
      </div>

      <p class="access-intro" id="accessIntro">Pilih jalur akses Anda.</p>

      <div class="access-choices" id="accessChoices">
        <button type="button" class="access-choice" id="chooseStaf">
          <strong>Akses Staf IGD</strong>
        </button>
        <button type="button" class="access-choice" id="choosePimpinan" aria-expanded="false" aria-controls="loginForm">
          <strong>Akses Pimpinan</strong>
        </button>
      </div>

      <form id="loginForm" class="login-form" hidden>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Masukkan username" autocomplete="username" required />

        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required />
          <button type="button" id="togglePassword">Tampilkan</button>
        </div>

        <button class="primary-btn full" type="submit">Masuk sebagai Pimpinan</button>
        <button class="access-back" type="button" id="backBtn">Kembali ke pilihan akses</button>
        <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const auth = window.IGDAuth;
      const params = new URLSearchParams(window.location.search);
      const needPimpinan = params.get('akses') === 'pimpinan';

      if (needPimpinan ? auth.isPimpinan() : auth.isAuthenticated()) {
        auth.goNext();
        return;
      }

      const choices = document.getElementById('accessChoices');
      const form = document.getElementById('loginForm');
      const intro = document.getElementById('accessIntro');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const error = document.getElementById('loginError');
      const pimBtn = document.getElementById('choosePimpinan');

      function showForm() {
        choices.hidden = true;
        form.hidden = false;
        pimBtn.setAttribute('aria-expanded', 'true');
        intro.textContent = needPimpinan
          ? 'Halaman yang Anda buka khusus pimpinan. Masuk dengan akun pimpinan.'
          : 'Masuk dengan akun pimpinan.';
        username.focus();
      }

      function showChoices() {
        form.hidden = true;
        choices.hidden = false;
        pimBtn.setAttribute('aria-expanded', 'false');
        intro.textContent = 'Pilih jalur akses Anda.';
        error.textContent = '';
      }

      document.getElementById('chooseStaf').addEventListener('click', function () {
        auth.enterStaf();
        // Staf yang tadinya membuka halaman pimpinan diarahkan ke beranda.
        if (needPimpinan) window.location.replace(auth.appUrl('index.html'));
        else auth.goNext();
      });
      pimBtn.addEventListener('click', showForm);
      document.getElementById('backBtn').addEventListener('click', showChoices);

      document.getElementById('togglePassword').addEventListener('click', function () {
        const hidden = password.type === 'password';
        password.type = hidden ? 'text' : 'password';
        this.textContent = hidden ? 'Sembunyikan' : 'Tampilkan';
      });

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        error.textContent = '';
        if (await auth.login(username.value, password.value)) {
          auth.goNext();
        } else {
          error.textContent = 'Username atau password salah.';
          password.value = '';
          password.focus();
        }
      });

      if (needPimpinan) showForm();
    })();
  </script>
</body>
</html>

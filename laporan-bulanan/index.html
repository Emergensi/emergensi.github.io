<!doctype html>

<head>
  <meta charset="utf-8" />

</head>
<body data-page="laporan-bulanan" data-group="laporan" data-root="../">
  <div class="page-shell">
    <header class="page-hero">
      <nav class="topbar" aria-label="Navigasi utama">
        <a class="brand" href="../index.html" aria-label="Emergency Unit SGH">
          <span class="brand-mark logo-mark"><img src="../assets/emergency-logo.png" alt="Logo Emergency Unit"></span>
          <span><strong>Emergency Unit</strong><small>Sedayu General Hospital</small></span>
        </a>
        <div class="top-actions">
          <a class="ghost-btn home-first" href="../index.html">Beranda</a>
          <div class="nav-links" id="navLinks" aria-label="Menu kategori"></div>
          <button class="ghost-btn danger" type="button" id="logoutBtn">Keluar</button>
        </div>
      </nav>
      <section class="page-hero-card">
        <a class="breadcrumb" href="../laporan/">← Kembali ke Laporan</a>
        <div class="page-title-row">
          <span class="page-big-icon">🗓️</span>
          <div><span class="eyebrow"><span></span> AKSES PIMPINAN</span><h1>Laporan Bulanan IGD</h1></div>
        </div>
        <p>Dibuat otomatis dari Register IGD. Pilih bulan, klik buat, lalu kirim ke Telegram atau unduh sebagai gambar. Batas pelaporan ke manajemen: tanggal 20 bulan berikutnya.</p>
      </section>
    </header>
    <main>
      <section class="section pt-page">
        <div class="lb-alat">
          <label>Bulan <input type="month" id="lbBulan" /></label>
          <button class="primary-btn" type="button" id="lbBuat">Buat laporan</button>
          <span class="lb-aksi" id="lbAksi" hidden>
            <button type="button" class="ghost-btn" id="lbTele">📨 Kirim ke Telegram</button>
            <button type="button" class="ghost-btn" id="lbGambar">⬇ Unduh JPG</button>
            <button type="button" class="ghost-btn" id="lbCetak">⬇ Unduh PDF</button>
          </span>
        </div>
        <p class="pt-sub" id="lbPesan" role="status"></p>
        <div id="lbHasil"></div>
      </section>
    </main>
  </div>
  <script src="../data.js"></script>
  <script src="../app.js"></script>

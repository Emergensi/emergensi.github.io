<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="icon" href="../assets/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Respon Time IGD SGH</title>
  <link rel="stylesheet" href="../style.css?v=20261014131233" />
  <style>
    .jw-app { max-width: 1040px; margin: 0 auto; padding: 16px 16px 40px; }
    .jw-app-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .jw-app-head img { width: 44px; height: 44px; border-radius: 12px; background: #fff; box-shadow: 0 4px 14px rgba(15,23,42,.12); }
    .jw-app-head h1 { font-size: 1.35rem; margin: 0; line-height: 1.1; }
    .jw-app-head small { color: #64748b; display: block; }
    .jw-app-jam { margin-left: auto; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: #0f172a; }
    .jw-pasang { display: none; margin-left: 12px; border: 1px solid #e2e8f0; background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
    .jw-pasang.tampil { display: inline-block; }
    .jw-tab { display: flex; gap: 8px; margin: 0 0 16px; background: #fff; padding: 6px; border-radius: 999px; border: 1px solid #e2e8f0; width: fit-content; }
    .jw-tab button { border: 0; background: transparent; border-radius: 999px; padding: 9px 18px; font-weight: 800; font-size: .95rem; cursor: pointer; color: #334155; }
    .jw-tab button[aria-selected="true"] { background: #0f172a; color: #fff; }
    .jw-panel[hidden] { display: none; }
    .jw-app-kaki { margin-top: 28px; font-size: .85rem; color: #64748b; text-align: center; }
    .jw-app-kaki a { color: inherit; }
    @media (max-width: 560px) { .jw-app-jam { font-size: 1.2rem; } .jw-pasang { margin-left: 6px; padding: 6px 10px; } }
  </style>
</head>
<body>
  <div class="jw-app">
    <header class="jw-app-head">
      <img src="../assets/emergency-logo.png" alt="Logo IGD SGH" />
      <div><h1>Respon Time IGD</h1><small>Sedayu General Hospital</small></div>
      <span class="jw-app-jam" id="jam">--:--</span>
      <button class="jw-pasang" id="pasang" type="button">⬇ Pasang di desktop</button>
    </header>
    <div class="jw-tab" role="tablist">
      <button type="button" role="tab" data-panel="jejak" aria-selected="true">⏱️ Respon Time</button>
      <button type="button" role="tab" data-panel="input" aria-selected="false">📝 Input Data</button>
    </div>
    <main>
      <section class="pt-page jw-panel" id="jejakRoot" data-panel="jejak"><p class="pt-sub">Memuat…</p></section>
      <section class="pt-page jw-panel" id="inputRoot" data-panel="input" hidden><p class="pt-sub">Memuat…</p></section>
    </main>
    <p class="jw-app-kaki">Waktu dicatat otomatis dari server · data lain dilengkapi di tab Input Data · <a href="../jejak/">buka di situs IGD</a> · <a href="https://docs.google.com/spreadsheets/d/1nGQOl939xO-qo5IoXhhFSsfARX0m3d2e4A61on2F4d4/edit?gid=0" target="_blank" rel="noopener">Google Sheet register ↗</a></p>
  </div>
  <script>
    (function () {
      const jam = document.getElementById('jam');
      const tik = () => { jam.textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); };
      tik(); setInterval(tik, 10000);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      let prompt = null; const btn = document.getElementById('pasang');
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); prompt = e; btn.classList.add('tampil'); });
      btn.addEventListener('click', async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; btn.classList.remove('tampil'); });
      window.addEventListener('appinstalled', () => btn.classList.remove('tampil'));
      // Tab: Respon Time / Input Data (pilihan terakhir diingat di perangkat ini)
      const pilih = (nama) => {
        document.querySelectorAll('.jw-tab button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.panel === nama)));
        document.querySelectorAll('main .jw-panel').forEach((x) => { x.hidden = x.dataset.panel !== nama; });
        try { localStorage.setItem('jw_tab', nama); } catch (e) {}
        if (nama === 'input' && window.IGDInput && window.IGDInput.siap) window.IGDInput.siap();
      };
      document.querySelectorAll('.jw-tab button').forEach((b) => b.addEventListener('click', () => pilih(b.dataset.panel)));
      window.addEventListener('load', () => { try { const t = localStorage.getItem('jw_tab'); if (t === 'input') pilih('input'); } catch (e) {} });
      // siapkan pilihan form Input Data di belakang layar, agar tab itu langsung terbuka
      window.addEventListener('load', () => setTimeout(() => { try { window.RegForm.opsi('').catch(() => {}); } catch (e) {} }, 3000));
    })();
  </script>
  <script src="../register-form.js?v=20261014131233"></script>
  <script src="../jejak.js?v=20261014131233"></script>
  <script src="../input.js?v=20261014131233"></script>
</body>
</html>
